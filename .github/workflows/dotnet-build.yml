name: .NET CI

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: arc-runner-set # Используем K3s раннер

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      # Если у вас есть тесты (например, xUnit), раскомментируйте:
      # - name: Test
      #   run: dotnet test --no-build --verbosity normal --configuration Release

      - name: Test Docker is running
        run: docker info

      # Пример сборки Docker-образа
      - name: Build Docker Image
        run: docker build -t rudota-online-api:latest .