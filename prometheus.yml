global:
  scrape_interval:     15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: identity-api
    static_configs:
      - targets: ["host.docker.internal:5001"]
    metrics_path: /metrics

  - job_name: gateway
    static_configs:
      - targets: ["host.docker.internal:5000"]
    metrics_path: /metrics